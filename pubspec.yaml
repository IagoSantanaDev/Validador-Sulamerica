name: validador_xml_sulamerica
description: >
  Validador de XML de guias TISS com regras de negócio para pré-validação
  antes do envio à SulAmérica.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  xml: ^6.5.0
  flutter_dropzone: ^4.2.0
  dio: ^5.7.0
  get_it: ^7.7.0
  logger: ^2.4.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
