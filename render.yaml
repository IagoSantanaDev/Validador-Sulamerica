# Render Blueprint — API intermediária SulAmérica.
# Referência: https://render.com/docs/blueprint-spec
#
# IMPORTANTE: a sessão do portal SulAmérica vive em memória (CookieJar).
# NÃO habilite réplicas/escala horizontal. No free tier o serviço dorme
# após ~15 min ocioso e a sessão é perdida — o front re-autentica.
services:
  - type: web
    name: validador-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: PORTAL_MAX_SESSIONS_PER_IDENTIFIER
        value: "5"
      - key: PORTAL_REQUEST_MAX_CONCURRENCY
        value: "20"
      - key: CORS_ORIGIN
        value: "https://iagosantanadev.github.io, https://validador-sulamerica.pages.dev"
      # CORS controla acesso pelo navegador; não autentica chamadas diretas
      # à API. Origens adicionais devem ser separadas por vírgula.
      # Cadastre as variáveis de credenciais no painel do Render. Não coloque
      # identificadores ou valores de credenciais neste arquivo.
      #
      # TLS: não há nada a configurar. A conexão com o portal usa a validação
      # de CA pública padrão do dart:io, que também confere o hostname. O
      # pinning por fingerprint foi removido — ver backend/README.md.