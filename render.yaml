# Render Blueprint — API intermediária SulAmérica.
# Referência: https://render.com/docs/blueprint-spec
#
# IMPORTANTE: a sessão do portal SulAmérica vive em memória (CookieJar).
# NÃO habilite réplicas/escala horizontal. No free tier o serviço dorme
# após ~15 min ocioso e a sessão é perdida — o front re-autentica.
services:
  - type: web
    name: validador-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: HOST
        value: "0.0.0.0"
      # Lista de origens permitidas, separadas por VÍRGULA (a barra final é
      # opcional e ignorada). Este valor fica em "*" por padrão; quem opera
      # precisa trocar por uma lista explícita no painel do Render
      # (Dashboard → Environment), porque o domínio do front é definido fora
      # do repositório. Exemplo do cenário real deste projeto:
      #   https://validador-sulamerica.pages.dev, http://localhost:3000
      # Nunca use barra entre as origens nem espaço antes da vírgula como
      # separador. A resposta ecoa só a origem que casar; o resto é bloqueado
      # pelo navegador. Ver backend/README.md.
      - key: CORS_ORIGIN
        value: "*"
      # Credenciais do portal, uma entrada por prestador aceito. `sync: false`
      # impede o valor real de entrar no repositório: defina no painel do
      # Render (Dashboard → Environment). Sem isso, o login responde 401
      # para qualquer identificador.
      #   PORTAL_PRESTADOR_ID_27372066000673_CODE
      #   PORTAL_PRESTADOR_ID_27372066000673_USER
      #   PORTAL_PRESTADOR_ID_27372066000673_SENHA
      # O identificador vai em MAIÚSCULAS e é o CNPJ/codigoPrestadorNaOperadora.
      #
      # TLS: não há nada a configurar. A conexão com o portal usa a validação
      # de CA pública padrão do dart:io, que também confere o hostname. O
      # pinning por fingerprint foi removido — ver backend/README.md.