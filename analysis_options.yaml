include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # O backend e um package Dart separado (deps proprias, sem `pub get` na raiz):
    # analisado pela raiz, todos os imports dele ficam sem resolver.
    - backend/**
    - build/**
    - web/**

linter:
  rules:
    prefer_const_constructors: true
    prefer_final_locals: true
    avoid_print: true
    require_trailing_commas: true
